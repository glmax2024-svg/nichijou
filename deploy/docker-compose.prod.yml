# 生产只用 Docker 跑 Postgres；应用本身由 systemd 管理（见 nichijou.service）。
# 用法（服务器上）：docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nichijou
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
      POSTGRES_DB: nichijou
    # 只监听本机，绝不对公网开放
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nichijou -d nichijou"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
